name: Build Yuehong Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 原作者代码有死逻辑，还是把私钥拉下来备用
    - name: Checkout Private Keystore
      uses: actions/checkout@v4
      with:
        repository: isaquxet08-ai/MGCE-Keystore
        token: ${{ secrets.KS_READ_TOKEN }}
        path: keystore-dir

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 编译 Debug 包（不需要注入 debuggable，本身就自带）
    - name: Build Debug APK
      id: gradle_build
      run: |
        ./gradlew :manager:assembleDebug -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=4g" 2>&1 | tee build_output.log

    # 如果编译失败，自动抓取错误日志并推回仓库
    - name: Capture Build Errors
      if: failure() && steps.gradle_build.outcome == 'failure'
      run: |
        mkdir -p ERRORBUILD
        LOG_FILE="ERRORBUILD/latest_error.log"
        grep -E "^e: file:" build_output.log > temp_errors.txt || true
        if [ -s temp_errors.txt ]; then
          while IFS= read -r line; do
            echo "$line" >> $LOG_FILE
            file_path=$(echo "$line" | sed -n 's|.*file:///home/runner/work/[^/]*/[^/]*/\(.*\):.*|\1|p')
            line_num=$(echo "$line" | sed -n 's|.*:\([0-9]*\):.*|\1|p')
            if [ -n "$file_path" ] && [ -n "$line_num" ]; then
              sed -n "$((line_num > 2 ? line_num - 2 : 1)),$((line_num + 2))p" "$file_path" >> $LOG_FILE
            fi
          done < temp_errors.txt
        else
          tail -n 50 build_output.log >> $LOG_FILE
        fi
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add ERRORBUILD/latest_error.log
        git commit -m "ci: 自动记录编译失败日志 [skip ci]" || echo "No changes"
        git push

    # 成功的话，全盘搜索 Debug 包并上传附件
    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Yuehong-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"
