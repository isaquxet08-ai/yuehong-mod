name: Build Yuehong Mod APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Checkout Private Keystore
      uses: actions/checkout@v4
      with:
        repository: isaquxet08-ai/MGCE-Keystore
        token: ${{ secrets.KS_READ_TOKEN }}
        path: keystore-dir

    # 🔨 自动拉取兵工厂最新的 libstellar.so
    - name: Download Pre-compiled libstellar.so
      run: |
        curl -L -o libstellar.so https://github.com/isaquxet08-ai/stellar-so-builder/releases/latest/download/libstellar.so
        chmod 755 libstellar.so
        mkdir -p manager/src/main/jniLibs/arm64-v8a/
        cp libstellar.so manager/src/main/jniLibs/arm64-v8a/libstellar.so

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      id: gradle_build
      run: |
        ./gradlew :manager:assembleDebug -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=4g"

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Yuehong-Mod-APK
        path: "**/build/outputs/apk/debug/*.apk"

    # 自动发布到 Releases 页面
    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.5.4-mod-${{ github.run_number }}
        name: 月虹提权助手 魔改版 (Build ${{ github.run_number }})
        body: |
          ### 本次自动编译更新内容：
          - 完美兼容 Android 10（写死端口 5555）
          - 移除官方签名校验与网络验证
          - 绕过强制更新（版本号已改 9999）
          - 自带 Debuggable 且自动拉取最新 libstellar.so
        draft: false
        prerelease: false
        files: "**/build/outputs/apk/debug/*.apk"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
