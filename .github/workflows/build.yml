name: Build Yuehong Mod APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write # 允许发布 Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Checkout Private Keystore
      uses: actions/checkout@v4
      with:
        repository: isaquxet08-ai/MGCE-Keystore
        token: ${{ secrets.KS_READ_TOKEN }}
        path: keystore-dir

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 1. 编译 Debug 包
    - name: Build Debug APK
      id: gradle_build
      run: |
        ./gradlew :manager:assembleDebug -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=4g"

    # 2. 给 Debug 包改个正式的名字，并统一放到 output 文件夹
    - name: Prepare APK for Release
      if: success()
      run: |
        mkdir -p output
        find . -name "*-debug.apk" -exec cp {} output/Yuehong-v1.5.4-Mod.apk \;
        echo "准备发布的文件："
        ls -lh output/

    # 3. 依然保留 Actions 附件（防丢）
    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Yuehong-Mod-APK
        path: output/Yuehong-v1.5.4-Mod.apk

    # 4. 发布到 Releases 页面（支持镜像加速下载）
    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.5.4-mod-${{ github.run_number }}
        name: 月虹提权助手 魔改版 (Build ${{ github.run_number }})
        body: |
          ### 本次自动编译更新内容：
          - 完美兼容 Android 10（写死端口 5555）
          - 移除官方签名校验与网络验证
          - 绕过强制更新（版本号已改 9999）
          - 自带 Debuggable（方便 MT 管理器直接拿 Root）

          **【下载提示】**
          由于 GitHub 直连较慢，国内用户可以复制下方链接使用镜像加速：
          `https://ghproxy.net/https://github.com/${{ github.repository }}/releases/download/v1.5.4-mod-${{ github.run_number }}/Yuehong-v1.5.4-Mod.apk`
        draft: false
        prerelease: false
        files: output/Yuehong-v1.5.4-Mod.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
