name: Build Yuehong Mod APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Checkout Private Keystore
      uses: actions/checkout@v4
      with:
        repository: isaquxet08-ai/MGCE-Keystore
        token: ${{ secrets.KS_READ_TOKEN }}
        path: keystore-dir

    # 🔨 核心：拉取并解压所有预编译的 .so 模块！
    - name: Download Pre-compiled SO Modules
      run: |
        # 下载兵工厂打包好的 zip
        curl -L -o so-modules.zip https://github.com/isaquxet08-ai/stellar-so-builder/releases/latest/download/so-modules.zip
        # 解压
        unzip so-modules.zip
        # 把所有 .so 塞进安卓的标准目录
        mkdir -p manager/src/main/jniLibs/arm64-v8a/
        cp *.so manager/src/main/jniLibs/arm64-v8a/
        echo "拉取到的预编译文件："
        ls -lh manager/src/main/jniLibs/arm64-v8a/

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      id: gradle_build
      run: |
        ./gradlew :manager:assembleDebug -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=4g"

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Yuehong-Mod-APK
        path: "**/build/outputs/apk/debug/*.apk"

    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.5.4-mod-${{ github.run_number }}
        name: 月虹提权助手 魔改版 (Build ${{ github.run_number }})
        body: |
          集成最新预编译模块，完美解锁 GhostLock 等高级功能。
        files: "**/build/outputs/apk/debug/*.apk"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
