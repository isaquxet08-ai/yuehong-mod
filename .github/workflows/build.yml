name: Build Yuehong Mod APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Checkout Private Keystore
      uses: actions/checkout@v4
      with:
        repository: isaquxet08-ai/MGCE-Keystore
        token: ${{ secrets.KS_READ_TOKEN }}
        path: keystore-dir

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 👇👇👇 这就是咱们新加的逻辑：用 Python 安全注入 debuggable 👇👇👇
    - name: Inject Android Debuggable
      run: |
        python3 -c "
        import glob
        import xml.etree.ElementTree as ET

        # 寻找所有模块下的 AndroidManifest.xml
        for file in glob.glob('*/src/main/AndroidManifest.xml'):
            try:
                ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
                tree = ET.parse(file)
                root = tree.getroot()
                app = root.find('application')
                if app is not None:
                    app.set('{http://schemas.android.com/apk/res/android}debuggable', 'true')
                    tree.write(file, encoding='utf-8', xml_declaration=True)
                    print(f'✅ 成功注入 debuggable: {file}')
            except Exception as e:
                print(f'❌ 注入失败 {file}: {e}')
        "

    - name: Build with Gradle
      run: ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=4g"
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/keystore-dir/yuehong_my_release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Yuehong-Mod-Release
        path: "**/build/outputs/apk/release/*.apk"
